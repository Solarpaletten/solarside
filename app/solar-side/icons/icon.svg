<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8a00"/>
      <stop offset="100%" stop-color="#ff5e00"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#g)"/>
  <circle cx="64" cy="64" r="60" fill="url(#glow)"/>
  <!-- sun rays -->
  <g stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.95">
    <line x1="64" y1="14" x2="64" y2="28"/>
    <line x1="64" y1="100" x2="64" y2="114"/>
    <line x1="14" y1="64" x2="28" y2="64"/>
    <line x1="100" y1="64" x2="114" y2="64"/>
    <line x1="28" y1="28" x2="38" y2="38"/>
    <line x1="90" y1="90" x2="100" y2="100"/>
    <line x1="28" y1="100" x2="38" y2="90"/>
    <line x1="90" y1="38" x2="100" y2="28"/>
  </g>
  <!-- inner sun -->
  <circle cx="64" cy="64" r="22" fill="#fff" opacity="0.97"/>
  <circle cx="64" cy="64" r="22" fill="url(#g)" opacity="0.15"/>
</svg>
