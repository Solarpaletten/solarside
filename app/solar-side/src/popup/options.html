<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Solar — Settings</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        width: 360px;
        background: #0e0e10;
        color: #e6e6e6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 16px;
        background: linear-gradient(135deg, #ff8a00, #ff5e00);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      label {
        display: block;
        margin-bottom: 12px;
        font-size: 12px;
        color: #999;
      }
      input {
        display: block;
        width: 100%;
        padding: 8px 10px;
        margin-top: 4px;
        background: #18181c;
        border: 1px solid #2a2a2f;
        border-radius: 6px;
        color: #fff;
        font-size: 13px;
      }
      button {
        padding: 8px 14px;
        margin-right: 8px;
        background: linear-gradient(135deg, #ff8a00, #ff5e00);
        color: #fff;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: #1c1c20;
        color: #ddd;
        font-weight: 500;
        border: 1px solid #2a2a2f;
      }
      .msg { margin-top: 12px; font-size: 12px; min-height: 16px; }
      .ok { color: #6ad48a; }
      .err { color: #ff5d5d; }
    </style>
  </head>
  <body>
    <h1>Solar — Settings</h1>
    <label>
      Core URL
      <input type="text" id="base-url" placeholder="http://localhost:8000" />
    </label>
    <label>
      API key
      <input type="password" id="api-key" placeholder="dev-key-1" />
    </label>
    <button id="save">Save</button>
    <button id="test" class="secondary">Test connection</button>
    <p id="msg" class="msg"></p>

    <script type="module" src="./options.js"></script>
  </body>
</html>
