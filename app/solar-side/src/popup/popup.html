<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Solar</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        width: 280px;
        background: #0e0e10;
        color: #e6e6e6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 14px;
        background: linear-gradient(135deg, #ff8a00, #ff5e00);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      p { color: #aaa; margin: 4px 0 12px; }
      .status { font-size: 11px; padding: 4px 8px; border-radius: 6px; background: #18181c; }
      .ok { color: #6ad48a; }
      .err { color: #ff5d5d; }
      button {
        display: block;
        width: 100%;
        margin-top: 8px;
        padding: 8px;
        background: #1c1c20;
        color: #ddd;
        border: 1px solid #2a2a2f;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover { background: #25252a; color: #fff; }
    </style>
  </head>
  <body>
    <h1>Solar</h1>
    <p>Highlight text on a page → click <strong>Solar</strong> button → result appears in the side panel.</p>
    <div id="status" class="status">Checking Core…</div>
    <button id="open-side-panel">Open side panel</button>
    <button id="open-options">Settings</button>
    <script type="module" src="popup.js"></script>
  </body>
</html>
